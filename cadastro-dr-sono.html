<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Cadastro de Vendedores — Dr. Sono</title>
<style>
  :root{--wine-900:#4a1020;--wine-800:#5e1729;--wine-950:#3a0c1a;
        --gold:#e5b769;--gold-2:#f8e0b8;--ink:#3a0c1a;--line:rgba(248,224,184,.16)}
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--gold-2);
    min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:34px 16px;
    background:radial-gradient(1100px 520px at 18% -8%,rgba(184,54,94,.5),transparent 60%),
      linear-gradient(160deg,var(--wine-900),var(--wine-800) 40%,var(--wine-950))}
  .card{width:100%;max-width:520px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.16));
    border:1px solid var(--line);border-radius:20px;padding:24px 22px 26px;box-shadow:0 24px 70px rgba(0,0,0,.45)}
  /* As duas marcas lado a lado, separadas por um fio: le como parceria, e
     nao como uma logo so. Limitadas pela ALTURA para se equilibrarem, ja que
     cada lojista manda a arte na proporcao que quiser. */
  .marcas{display:flex;align-items:center;justify-content:center;gap:20px}
  .marcas img{max-height:38px;max-width:44%;display:block}
  .divisa{width:1px;align-self:stretch;min-height:32px;background:var(--line);flex:none}
  .loja-txt{color:#fff;font-weight:700;font-size:17px;line-height:1.2}
  h1{font-size:22px;margin:20px 0 0;color:#fff;text-align:center}
  .aviso{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
    font-size:12.5px;color:var(--gold);margin:14px 0 18px;line-height:1.55}
  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--gold);opacity:.85;margin:14px 0 5px}
  input{width:100%;padding:12px 13px;border-radius:11px;border:1px solid var(--line);
    background:rgba(0,0,0,.22);color:#fff;font-size:16px;outline:none}
  input::placeholder{color:rgba(248,224,184,.38)}
  input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(229,183,105,.18)}
  /* O autofill do Chrome pinta o campo de azul claro. Sobre um formulario
     escuro isso inverte o sinal: o campo preenchido fica aceso e o campo com
     erro, que continua escuro, e o que parece normal. Reverter so funciona
     com box-shadow interno — background-color o navegador ignora. */
  input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus{
    -webkit-text-fill-color:#fff;-webkit-box-shadow:0 0 0 1000px #46101d inset;
    caret-color:#fff;transition:background-color 9999s ease-in-out 0s}
  /* O erro marca o CAMPO, nao so a linha embaixo dele. */
  input.ruim,input.ruim:-webkit-autofill{border-color:#ff9a9a;
    -webkit-box-shadow:0 0 0 1000px #5c1420 inset,0 0 0 3px rgba(255,154,154,.16);
    box-shadow:0 0 0 3px rgba(255,154,154,.16)}
  input.ruim:focus{border-color:#ffbcbc;box-shadow:0 0 0 3px rgba(255,154,154,.30)}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
  button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:11px;cursor:pointer;
    background:linear-gradient(180deg,#fff7e9,var(--gold-2) 40%,var(--gold));color:var(--ink);
    font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.03em}
  button:disabled{opacity:.6;cursor:default}
  .erro{color:#ffb3b3;font-size:12.5px;margin-top:6px;min-height:17px}
  .erro.on{display:flex;align-items:flex-start;gap:7px;font-weight:600}
  .erro.on::before{content:"!";flex:none;width:16px;height:16px;border-radius:50%;
    background:#ff9a9a;color:#5e1729;font-weight:900;font-size:11px;line-height:16px;
    text-align:center;margin-top:1px}
  .msg{margin-top:16px;font-size:14px;text-align:center;line-height:1.55}
  .msg.ok{color:var(--gold-2)} .msg.err{color:#ffc0c0}
  .rodape{margin-top:24px;padding-top:16px;border-top:1px solid var(--line);text-align:center}
  .rodape p{font-size:11.5px;color:var(--gold);opacity:.75;margin:0 0 12px;line-height:1.6}
  .peoplefy{max-width:104px;display:block;margin:0 auto;opacity:.7}
  .peoplefy-txt{font-size:12px;color:var(--gold);opacity:.7;letter-spacing:.06em}
</style></head>

<script>
const D = {"endpoint": "https://orthocrin-cadastro.suportecomercial.workers.dev/cadastro", "lojista_id": 2794, "lojista_nome": "Dr. Sono"};
const $ = id => document.getElementById(id);
const soDig = s => (s||'').replace(/\D/g,'');
function validaCpf(v){ const c=soDig(v); if(c.length!==11||/^(\d)\1{10}$/.test(c))return false;
  const dv=n=>{let s=0;for(let i=0;i<n;i++)s+=+c[i]*(n+1-i);let r=(s*10)%11;return r===10?0:r;};
  return dv(9)===+c[9]&&dv(10)===+c[10]; }
function mascaraCpf(v){const c=soDig(v).slice(0,11);return c.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})\.(\d{3})(\d)/,'$1.$2.$3').replace(/(\d{3})\.(\d{3})\.(\d{3})(\d)/,'$1.$2.$3-$4');}
function mascaraTel(v){const c=soDig(v).slice(0,11);if(c.length<=2)return c;if(c.length<=7)return'('+c.slice(0,2)+') '+c.slice(2);return'('+c.slice(0,2)+') '+c.slice(2,7)+'-'+c.slice(7);}
const CAMPOS = ['nome','cpf','telefone','email','email2'];
const MASCARA = {cpf:mascaraCpf, telefone:mascaraTel};
const REGRAS = {
  nome: v => v.trim().split(/\s+/).filter(Boolean).length>=2 ? '' : 'Digite nome e sobrenome.',
  cpf: v => validaCpf(v) ? '' : 'CPF inválido. Confira os números digitados.',
  telefone: v => soDig(v).length===11 ? '' : 'Telefone com DDD e 9 dígitos.',
  email: v => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.trim()) ? '' : 'Email inválido.',
  // O email e a chave que liga a pessoa a Peoplefy: digitado errado, o
  // cadastro chega e nunca acha dono. Por isso ele e conferido duas vezes.
  email2: v => { const em = $('email').value.trim().toLowerCase();
    return (em && v.trim().toLowerCase() === em) ? '' : 'Os emails não conferem.'; }
};
function erro(campo,txt){
  const alvo=$(campo), linha=$('e-'+campo);
  linha.textContent=txt||''; linha.className='erro'+(txt?' on':'');
  alvo.classList.toggle('ruim',!!txt);
  alvo.setAttribute('aria-invalid',txt?'true':'false');
  return !txt;
}
function validaCampo(id){ return erro(id, REGRAS[id]($(id).value)); }
CAMPOS.forEach(id=>{
  const i=$(id);
  i.addEventListener('input',()=>{
    if(MASCARA[id]) i.value=MASCARA[id](i.value);
    if(i.classList.contains('ruim')) validaCampo(id);   // o erro some assim que arruma
    if(id==='email' && $('email2').value) validaCampo('email2');
  });
  // So confere ao sair de campo ja preenchido: tabular por um formulario
  // vazio nao pode acender tudo de vermelho antes da pessoa digitar nada.
  i.addEventListener('blur',()=>{ if(i.value.trim()) validaCampo(id); });
});
function valida(){
  const ruins = CAMPOS.filter(id => !validaCampo(id));   // avalia todos, nao para no primeiro
  if(ruins.length){
    // Levar a pessoa ate o erro. Sem isto o botao simplesmente nao respondia,
    // e o motivo ficava fora da tela ou passava despercebido.
    const primeiro=$(ruins[0]);
    if(primeiro.focus) primeiro.focus();
    if(primeiro.scrollIntoView) primeiro.scrollIntoView({block:'center',behavior:'smooth'});
    msg(ruins.length===1 ? 'Confira o campo destacado acima.'
      : 'Confira os '+ruins.length+' campos destacados acima.','err');
  }
  return ruins.length===0;
}
function msg(t,cls){const m=$('msg');m.textContent=t||'';m.className='msg '+(cls||'');m.style.display=t?'block':'none';}
$('f').addEventListener('submit', async e=>{
  e.preventDefault();
  if($('hp').value){ msg('Cadastro enviado. Aguarde o email de liberação do acesso.','ok'); return; }
  if(!valida()) return;
  // O lojista viaja em codigo_loja/loja_label, que o worker JA repassa para
  // dentro do pacote cifrado sem interpretar. Assim esta pagina funciona com
  // o worker que esta publicado hoje: nada a republicar, e nenhum risco para
  // a franquia, que usa o MESMO worker e o MESMO KV.
  // O prefixo "MM:" separa dos codigos de loja da franquia, que sao numericos.
  const corpo={nome:$('nome').value.trim(), cpf:soDig($('cpf').value),
    telefone:soDig($('telefone').value), email:$('email').value.trim().toLowerCase(),
    codigo_loja:'MM:'+D.lojista_id, loja_label:D.lojista_nome, hp:''};
  $('btn').disabled=true; msg('Enviando…','ok');
  try{
    const r=await fetch(D.endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(corpo)});
    const d=await r.json();
    if(d.status==='ok'){ msg('Cadastro enviado. A equipe irá conferir os dados e criar o seu acesso. Você receberá um email quando seu acesso for liberado.','ok'); $('f').reset(); }
    else if(d.status==='ja_na_peoplefy'){ msg('O seu acesso já está liberado. Entre com o seu email; não é necessário se cadastrar novamente.','ok'); }
    else if(d.status==='em_aprovacao'){ msg('O seu cadastro já foi recebido e está em conferência. Você receberá um email quando seu acesso for liberado.','ok'); }
    else if(d.status==='erro_validacao'){ msg('Confira os dados informados: '+(d.campo||'')+'.','err'); }
    else { msg('Não foi possível enviar agora. Tente novamente em alguns instantes.','err'); }
  }catch(err){ msg('Sem conexão com o servidor. Tente novamente em alguns instantes.','err'); }
  finally{ $('btn').disabled=false; }
});
</script>
